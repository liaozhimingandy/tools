# =============================================================================
# 云主机部署：直接拉取 GitHub Actions 构建好的镜像，不在云主机上编译。
#
# 与 docker-compose.yml 的区别：api 服务用 image 而非 build，端口只绑回环地址，
# 由 https://api.alsoapp.com 的 Nginx / 云 LB 终结 TLS 后转发，不对外暴露裸 HTTP。
#
# 用法（在 backend/ 目录下）：
#   1) cp .env.example .env，填数据库/CORS；再追加一行固定版本：
#        TOOLS_IMAGE=ghcr.io/liaozhimingandy/fastapi-tools:sha-<7位commit>
#      固定 sha 而不是 latest，回滚与审计才有意义（标签见 Actions 构建报告）。
#   2) GHCR：本仓库 package 已实测可匿名 `docker pull`，通常无需登录；
#      若改为私有再执行 docker login ghcr.io -u <github-user> -p <PAT:read:packages>
#   3) docker compose -f docker-compose.image.yml up -d
#      init-db 幂等执行 001 建表；api 在其成功后启动。
#   4) docker compose -f docker-compose.image.yml logs -f api
#      curl http://127.0.0.1:8080/v1/health 做本机健康检查。
#
# 反代若与容器不在同一台机器，把 .env 里的 TOOLS_BIND_ADDR 设为可达的网卡地址；
# 无论如何都不要把这个 HTTP 端口直接暴露到公网。
# =============================================================================

services:
  init-db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: ${TOOLS_PG_HOST}
      PGPORT: ${TOOLS_PG_PORT:-6432}
      PGUSER: ${TOOLS_PG_USER}
      PGPASSWORD: ${TOOLS_PG_PASSWORD}
      PGDATABASE: ${TOOLS_PG_NAME}
    volumes:
      - ./sql:/sql:ro
    command: >
      sh -c 'echo "== applying 001_tool_configs.sql ==";
        psql -v ON_ERROR_STOP=1 -f /sql/001_tool_configs.sql'

  api:
    image: ${TOOLS_IMAGE:-ghcr.io/liaozhimingandy/fastapi-tools:latest}
    restart: unless-stopped
    depends_on:
      init-db:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # 覆盖镜像内默认，确保容器内监听所有接口（对外收敛靠 ports 绑定回环）
      TOOLS_HOST: 0.0.0.0
      TOOLS_PORT: ${TOOLS_PORT:-8080}
    ports:
      - "${TOOLS_BIND_ADDR:-127.0.0.1}:${TOOLS_PORT:-8080}:${TOOLS_PORT:-8080}"
    read_only: true
    tmpfs:
      - /tmp
